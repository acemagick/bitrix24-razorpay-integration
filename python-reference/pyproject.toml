[project]
name = "bitrix24-razorpay-integration"
version = "0.1.0"
description = "Creates Razorpay payment links for Bitrix24 deals and posts payment status back to the deal timeline."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
# Lets tests be plain `async def` functions without a decorator on each one.
asyncio_mode = "auto"
